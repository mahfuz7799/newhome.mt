<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Contact | NewHome Developments</title>
    <meta
      name="description"
      content="Enquire about NewHome Developments properties, EPCs and engineers’ reports."
    />
    <link rel="icon" href="images/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=Newsreader:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header></header>
    <main>
      <section class="sec">
        <div class="wrap">
          <div class="two">
            <div>
              <h1>Contact us</h1>
              <form id="enquiry">
                <input
                  type="text"
                  name="_honey"
                  style="display: none"
                  tabindex="-1"
                  autocomplete="off"
                  aria-hidden="true"
                />
                <div>
                  <label for="n">Name</label
                  ><input id="n" name="name" required autocomplete="name" />
                </div>
                <div>
                  <label for="e">Email</label
                  ><input
                    id="e"
                    name="email"
                    type="email"
                    required
                    autocomplete="email"
                  />
                </div>
                <div>
                  <label for="p">Phone number</label
                  ><input
                    id="p"
                    name="phone"
                    type="tel"
                    required
                    autocomplete="tel"
                  />
                </div>
                <div>
                  <label for="m">Message</label
                  ><textarea id="m" name="message" rows="5" required></textarea>
                </div>
                <button class="btn" type="submit">Send Enquiry</button>
                <p id="sent" role="status"></p>
              </form>
            </div>
            <div>
              <h2>Get in touch</h2>
              <p>
                Call or WhatsApp <a href="tel:+35699992244">9999 2244</a
                ><br />Direct from owner / developer.
              </p>
              <p>
                Ask about our developments, Energy Performance Certificates
                (EPCs) or engineers’ reports.
              </p>
              <p>
                Email:
                <a href="mailto:newhomemlt@gmail.com">newhomemlt@gmail.com</a>
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer></footer>
    <script src="js/projects.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
